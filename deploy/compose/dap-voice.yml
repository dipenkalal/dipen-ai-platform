services:
  voice:
    build:
      context: ../../platform/voice
      dockerfile: Dockerfile
    container_name: dap-voice
    restart: unless-stopped
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      DAP_VOICE_THREADS: "4"
      DAP_VOICE_TRANSCRIBE_TIMEOUT: "45"
    read_only: true
    tmpfs:
      - /tmp:size=96m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1200m
    cpus: 4.0
