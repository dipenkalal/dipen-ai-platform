services:
  dashboard:
    build:
      context: /home/dipen/dap/source/dipen-ai-platform/apps/dashboard
      dockerfile: Dockerfile
    container_name: dap-dashboard
    restart: unless-stopped
    ports:
      - "80:3000"
    environment:
      DAP_BACKEND_BASE_URL: http://host.docker.internal:8002
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q -O /dev/null http://127.0.0.1:3000/career || false
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - career-network

networks:
  career-network:
    external: true
    name: compose_dap-network
