name: Phase 13 Provider-Specific Research Activation

on:
  pull_request:
  push:
    branches:
      - phase13/provider-specific-research-activation

permissions:
  contents: read

concurrency:
  group: phase13-provider-specific-research-activation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-activation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            platform/backend/requirements.txt
            platform/backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff activation boundary
        run: |
          python -m ruff check \
            agents/schemas.py \
            agents/service.py \
            agents/research_executor.py \
            agents/registry.py \
            tests/test_phase13_provider_specific_research_activation.py \
            tests/test_phase12_research_agent_integration.py
      - name: Mypy activation boundary
        run: |
          python -m mypy \
            agents/schemas.py \
            agents/service.py \
            agents/research_executor.py \
            --follow-imports=skip
      - name: Compile activation boundary
        run: |
          python -m compileall -q \
            agents/schemas.py \
            agents/service.py \
            agents/research_executor.py \
            tests/test_phase13_provider_specific_research_activation.py
      - name: Phase 13 activation tests
        run: |
          python -m pytest -q \
            tests/test_phase13_provider_specific_research_activation.py
      - name: Sealed Phase 12 regression matrix
        run: |
          python -m pytest -q \
            tests/test_phase12_internet_destination_policy.py \
            tests/test_phase12_internet_transport.py \
            tests/test_phase12_untrusted_internet_content.py \
            tests/test_phase12_research_retrieval_evidence.py \
            tests/test_phase12_internet_research_tool.py \
            tests/test_phase12_research_agent_integration.py \
            tests/test_phase12_searxng_search_provider.py \
            tests/test_phase12_searxng_search_discovery.py \
            tests/test_phase12_web_search_discovery.py \
            tests/test_phase12i_research_workspace.py \
            tests/test_phase12j_research_benchmark.py \
            tests/test_phase12j_research_benchmark_bootstrap.py

  guardian-activation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/guardian
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Compile activation Guardian boundaries
        run: |
          python -m compileall -q \
            tests/test_phase12h_searxng_provider_boundary.py \
            tests/test_phase13_provider_specific_research_activation_boundary.py
      - name: Provider-specific activation Guardian boundary
        run: |
          python -m unittest -v \
            tests.test_phase12h_searxng_provider_boundary \
            tests.test_phase13_provider_specific_research_activation_boundary

  dashboard-activation:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Lint dashboard
        run: npm run lint
      - name: Build dashboard
        run: npm run build
      - name: Build production dashboard image
        run: docker build --pull=false -t dap-dashboard-phase13-ci .
