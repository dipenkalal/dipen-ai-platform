name: Phase 11G Dashboard Runtime Artifact

on:
  push:
    branches:
      - phase11/autonomous-engineering-agent

permissions:
  contents: read

concurrency:
  group: phase11g-dashboard-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-dashboard-runtime:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint dashboard
        run: npm run lint
      - name: Build standalone dashboard
        run: npm run build
      - name: Package standalone runtime
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: |
          test -f .next/standalone/server.js
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          if [ -d public ]; then
            cp -R public .next/standalone/public
          fi
          tar -C .next/standalone -czf phase11g-dashboard-standalone.tar.gz .
          sha256sum phase11g-dashboard-standalone.tar.gz > phase11g-dashboard-standalone.tar.gz.sha256
          printf '{"source_commit":"%s","node_version":"%s","next_version":"16.2.11","artifact_schema":"phase11g-dashboard-standalone-v1"}\n' \
            "$SOURCE_COMMIT" "$(node --version)" > phase11g-dashboard-manifest.json
      - name: Upload standalone runtime
        uses: actions/upload-artifact@v7
        with:
          name: phase11g-dashboard-standalone
          path: |
            apps/dashboard/phase11g-dashboard-standalone.tar.gz
            apps/dashboard/phase11g-dashboard-standalone.tar.gz.sha256
            apps/dashboard/phase11g-dashboard-manifest.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
