name: Phase 12I Research Workspace Dashboard

on:
  pull_request:
  push:
    branches:
      - phase12/internet-research-gateway

permissions:
  contents: read

concurrency:
  group: phase12i-research-workspace-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dashboard-boundary:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Research workspace authority boundary
        run: npm run test:research-workspace
      - name: Lint dashboard
        run: npm run lint
      - name: Build dashboard
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
      - name: Build production dashboard image
        env:
          DOCKER_BUILDKIT: 1
        run: docker build --progress=plain -t dap-dashboard-phase12i-ci .
