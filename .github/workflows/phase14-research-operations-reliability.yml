name: Phase 14 Research Operations Reliability

on:
  pull_request:
  push:
    branches:
      - phase14/research-operations-reliability
  schedule:
    - cron: "17 4 * * 6"

permissions:
  contents: read

concurrency:
  group: phase14-research-operations-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-reliability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            platform/backend/requirements.txt
            platform/backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff Phase 14 boundary
        run: |
          python -m ruff check \
            agents/research_executor.py \
            gateway/research_source_quality.py \
            gateway/research_operations_repository.py \
            gateway/research_operations.py \
            gateway/research_provider_health.py \
            gateway/research_resource_snapshot.py \
            gateway/research_reliability_benchmark.py \
            gateway/web_search_discovery.py \
            gateway/research_routes.py \
            tools/internet_research_tools.py \
            tests/test_phase14_source_quality.py \
            tests/test_phase14_retrieval_reliability.py \
            tests/test_phase14_research_operations.py \
            tests/test_phase14_reliability_benchmark.py
      - name: Mypy Phase 14 boundary
        run: |
          python -m mypy \
            agents/research_executor.py \
            gateway/research_source_quality.py \
            gateway/research_operations_repository.py \
            gateway/research_operations.py \
            gateway/research_provider_health.py \
            gateway/research_resource_snapshot.py \
            gateway/research_reliability_benchmark.py \
            gateway/web_search_discovery.py \
            gateway/research_routes.py \
            tools/internet_research_tools.py \
            --follow-imports=skip
      - name: Compile Phase 14 boundary
        run: |
          python -m compileall -q \
            agents/research_executor.py \
            gateway/research_source_quality.py \
            gateway/research_operations_repository.py \
            gateway/research_operations.py \
            gateway/research_provider_health.py \
            gateway/research_resource_snapshot.py \
            gateway/research_reliability_benchmark.py \
            gateway/web_search_discovery.py \
            gateway/research_routes.py \
            tools/internet_research_tools.py \
            tests/test_phase14_source_quality.py \
            tests/test_phase14_retrieval_reliability.py \
            tests/test_phase14_research_operations.py \
            tests/test_phase14_reliability_benchmark.py
      - name: Phase 14 reliability tests
        run: |
          python -m pytest -q \
            tests/test_phase14_source_quality.py \
            tests/test_phase14_retrieval_reliability.py \
            tests/test_phase14_research_operations.py \
            tests/test_phase14_reliability_benchmark.py
      - name: Deterministic Phase 14 reliability benchmark
        run: |
          python -m gateway.research_reliability_benchmark \
            --source-commit "${GITHUB_SHA}" \
            --output /tmp/phase14-reliability-benchmark.json
          python - <<'PY'
          import json
          payload=json.load(open('/tmp/phase14-reliability-benchmark.json', encoding='utf-8'))
          assert payload['benchmark_version'] == 'phase14i.1'
          assert payload['case_count'] == 5
          assert payload['cases_passed'] == 5
          assert payload['all_cases_passed'] is True
          assert payload['smart_routing_research_activated'] is False
          assert payload['network_authority_expanded'] is False
          assert payload['destructive_retention_action_performed'] is False
          print('phase14_reliability_benchmark_ci|PASS')
          PY
      - name: Sealed Phase 12 and Phase 13 regressions
        run: |
          python -m pytest -q \
            tests/test_phase12_internet_destination_policy.py \
            tests/test_phase12_internet_transport.py \
            tests/test_phase12_untrusted_internet_content.py \
            tests/test_phase12_research_retrieval_evidence.py \
            tests/test_phase12_internet_research_tool.py \
            tests/test_phase12_research_agent_integration.py \
            tests/test_phase12_searxng_search_provider.py \
            tests/test_phase12_searxng_search_discovery.py \
            tests/test_phase12_web_search_discovery.py \
            tests/test_phase12i_research_workspace.py \
            tests/test_phase12j_research_benchmark.py \
            tests/test_phase13_provider_specific_research_activation.py
      - name: Live operator and recovery syntax
        working-directory: .
        run: |
          bash -n scripts/phase14-research-operations-live-burnin.sh
          python -m py_compile scripts/phase14_research_operations_provider_recovery.py

  guardian-reliability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/guardian
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Compile Guardian boundaries
        run: |
          python -m compileall -q \
            tests/test_phase14_research_operations_boundary.py \
            tests/test_phase14_live_burnin_operator_boundary.py \
            tests/test_phase14_provider_recovery_boundary.py \
            tests/test_phase13_provider_specific_research_activation_boundary.py \
            tests/test_phase12h_searxng_provider_boundary.py
      - name: Phase 14 Guardian boundary
        run: |
          python -m unittest -v \
            tests.test_phase14_research_operations_boundary \
            tests.test_phase14_live_burnin_operator_boundary \
            tests.test_phase14_provider_recovery_boundary \
            tests.test_phase13_provider_specific_research_activation_boundary \
            tests.test_phase12h_searxng_provider_boundary

  dashboard-reliability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Research workspace boundary
        run: npm run test:research-workspace
      - name: Research operations boundary
        run: npm run test:research-operations
      - name: Lint dashboard
        run: npm run lint
      - name: Build dashboard
        run: npm run build
      - name: Build production dashboard image
        run: docker build --pull=false -t dap-dashboard-phase14-ci .
