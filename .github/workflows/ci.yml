name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: platform/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            platform/backend/requirements.txt
            platform/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            -r requirements-dev.txt

      - name: Ruff
        run: |
          python -m ruff check \
            agents/orchestration/executor.py \
            agents/orchestration/service.py \
            agents/orchestration/validator.py \
            agents/runtime_instrumentation.py \
            agents/service.py \
            agents/truth_repository.py \
            agents/truth_routes.py \
            agents/truth_schemas.py \
            agents/truth_service.py \
            tests/test_agent_truth_foundation.py \
            tests/test_orchestration_validator.py \
            tests/test_runtime_instrumentation.py

      - name: Mypy
        run: |
          python -m mypy \
            agents/orchestration/validator.py \
            agents/runtime_instrumentation.py \
            agents/truth_repository.py \
            agents/truth_service.py \
            --follow-imports=skip

      - name: Compile Python
        run: |
          python -m compileall \
            -q \
            agents/orchestration/executor.py \
            agents/orchestration/service.py \
            agents/orchestration/validator.py \
            agents/runtime_instrumentation.py \
            agents/service.py \
            agents/truth_repository.py \
            agents/truth_routes.py \
            agents/truth_schemas.py \
            agents/truth_service.py \
            tests/test_agent_truth_foundation.py \
            tests/test_orchestration_validator.py \
            tests/test_runtime_instrumentation.py

      - name: Backend tests
        run: |
          python -m pytest \
            -q \
            tests/test_agent_truth_foundation.py \
            tests/test_orchestration_validator.py \
            tests/test_runtime_instrumentation.py

  guardian:
    name: guardian
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: platform/guardian

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Compile Guardian
        run: |
          python -m compileall -q \
            action_history.py \
            app.py \
            broker.py \
            broker_client.py \
            broker_entrypoint.py \
            broker_server.py \
            control_plane.py \
            execution_recovery.py \
            executor.py \
            execution_service.py \
            owner_authorization.py \
            root_authorization.py \
            root_authorization_cli.py \
            sqlite_support.py \
            tests

      - name: Guardian safety tests
        run: PYTHONWARNINGS=error::ResourceWarning python -m unittest discover -s tests -v

      - name: Confirm test SQLite connections are explicitly managed
        run: |
          if grep -R -nE \
            'with[[:space:]]+sqlite3\.connect[[:space:]]*\(' \
            tests; then
            echo "sqlite3 connection context managers do not close connections."
            echo "Use sqlite_support.managed_connection or an explicit close."
            exit 1
          fi

      - name: Confirm privileged boundary separation
        run: |
          if grep -nE \
            'subprocess|os\.system|Popen|check_call|check_output' \
            action_history.py \
            broker.py \
            broker_client.py \
            broker_entrypoint.py \
            broker_server.py \
            control_plane.py \
            execution_recovery.py \
            owner_authorization.py \
            root_authorization.py \
            root_authorization_cli.py \
            execution_service.py; then
            echo "Only executor.py may contain command execution."
            exit 1
          fi

      - name: Confirm validation-only Guardian broker client
        run: |
          if grep -nE \
            'execute_backend_restart|execute_authorized|reservation_id' \
            broker_client.py \
            control_plane.py; then
            echo "Guardian-side broker access must remain validation only."
            exit 1
          fi

      - name: Confirm fixed executor commands
        run: |
          if grep -nE 'shell[[:space:]]*=' executor.py; then
            echo "Shell execution is forbidden."
            exit 1
          fi

          python - <<'PY'
          import executor

          assert executor.BACKEND_RESTART_COMMAND == (
              "/usr/bin/systemctl",
              "restart",
              "dap-backend.service",
          )

          assert executor.BACKEND_VERIFY_COMMAND == (
              "/usr/bin/systemctl",
              "is-active",
              "dap-backend.service",
          )
          PY

      - name: Confirm broker recovery entrypoint
        run: |
          grep -F \
            'ExecStart=/usr/bin/python3 /opt/dap/guardian/broker_entrypoint.py' \
            ../../deploy/systemd/dap-guardian-broker.service

      - name: Confirm Guardian control-plane entrypoint
        run: |
          grep -F \
            'ExecStart=/usr/bin/python3 /opt/dap/guardian/control_plane.py' \
            ../../deploy/systemd/dap-guardian.service

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint dashboard
        run: npm run lint

      - name: Guardian local voice safety
        run: npm run test:guardian-voice

      - name: Build dashboard
        env:
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build
