name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: platform/backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            platform/backend/requirements.txt
            platform/backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r requirements.txt \
            -r requirements-dev.txt

      - name: Ruff
        run: |
          python -m ruff check \
            agents/orchestration/validator.py \
            tests/test_orchestration_validator.py

      - name: Mypy
        run: |
          python -m mypy \
            agents/orchestration/validator.py \
            --follow-imports=skip

      - name: Compile Python
        run: |
          python -m compileall \
            -q \
            agents/orchestration/validator.py \
            tests/test_orchestration_validator.py

      - name: Backend tests
        run: |
          python -m pytest \
            -q \
            tests/test_orchestration_validator.py

  guardian:
    name: guardian
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: platform/guardian

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Compile Guardian
        run: python -m compileall -q app.py broker.py broker_server.py tests/test_broker.py

      - name: Guardian broker safety tests
        run: python -m unittest discover -s tests -v

      - name: Confirm broker is non-executing
        run: |
          if grep -nE 'subprocess|os\.system|Popen|check_call|check_output' broker.py; then
            echo "Command execution functions are not allowed in the dry-run broker."
            exit 1
          fi

  dashboard:
    name: dashboard
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/dashboard

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint dashboard
        run: npm run lint

      - name: Build dashboard
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build
