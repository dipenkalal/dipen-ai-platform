name: Phase 11I Owner Review Runtime Artifact

on:
  pull_request:
  push:
    branches:
      - phase11/autonomous-engineering-agent

permissions:
  contents: read

concurrency:
  group: phase11i-owner-review-artifact-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-owner-review-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install helper validation tools
        run: python -m pip install ruff==0.16.0 mypy==2.3.0
      - name: Ruff owner review smoke helper
        run: python -m ruff check platform/backend/engineering/engineering_owner_review_smoke.py
      - name: Mypy owner review smoke helper
        run: >-
          python -m mypy
          platform/backend/engineering/engineering_owner_review_smoke.py
          --follow-imports=skip
      - name: Compile owner review smoke helper
        run: python -m compileall -q platform/backend/engineering/engineering_owner_review_smoke.py

  build-dashboard-runtime:
    needs: validate-owner-review-smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint dashboard
        run: npm run lint
      - name: Build standalone dashboard
        run: npm run build
      - name: Package standalone runtime
        env:
          SOURCE_COMMIT: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          test -f .next/standalone/server.js
          mkdir -p .next/standalone/.next
          cp -R .next/static .next/standalone/.next/static
          if [ -d public ]; then
            cp -R public .next/standalone/public
          fi
          tar -C .next/standalone -czf phase11i-dashboard-standalone.tar.gz .
          sha256sum phase11i-dashboard-standalone.tar.gz > phase11i-dashboard-standalone.tar.gz.sha256
          printf '{"source_commit":"%s","node_version":"%s","next_version":"16.2.11","artifact_schema":"phase11i-dashboard-standalone-v1"}\n' \
            "$SOURCE_COMMIT" "$(node --version)" > phase11i-dashboard-manifest.json
      - name: Upload standalone runtime
        uses: actions/upload-artifact@v7
        with:
          name: phase11i-dashboard-standalone
          path: |
            apps/dashboard/phase11i-dashboard-standalone.tar.gz
            apps/dashboard/phase11i-dashboard-standalone.tar.gz.sha256
            apps/dashboard/phase11i-dashboard-manifest.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
