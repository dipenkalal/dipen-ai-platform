name: Temporary Phase 12 Ruff Preview

on:
  pull_request:
  push:
    branches:
      - phase12/internet-research-gateway

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Install Ruff
        run: python -m pip install ruff==0.16.0
      - name: Show canonical Ruff rewrite
        run: |
          python -m ruff check --fix gateway/research_routes.py
          echo '=== RUFF CANONICAL DIFF ==='
          git diff -- gateway/research_routes.py
