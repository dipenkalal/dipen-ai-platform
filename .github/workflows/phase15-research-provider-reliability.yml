name: Phase 15 Research Provider Reliability

on:
  pull_request:
  push:
    branches:
      - phase15/research-provider-reliability

permissions:
  contents: read

concurrency:
  group: phase15-research-provider-reliability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-provider-reliability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            platform/backend/requirements.txt
            platform/backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt
      - name: Ruff Phase 15 provider boundary
        run: |
          python -m ruff check \
            gateway/searxng_search_provider.py \
            gateway/web_search_discovery.py \
            gateway/research_query_fallback.py \
            gateway/research_source_quality.py \
            tests/test_phase15_searxng_provider_reliability.py \
            tests/test_phase15_query_fallback_and_source_quality.py
      - name: Mypy Phase 15 provider boundary
        run: |
          python -m mypy \
            gateway/searxng_search_provider.py \
            gateway/web_search_discovery.py \
            gateway/research_query_fallback.py \
            gateway/research_source_quality.py \
            --follow-imports=skip
      - name: Compile Phase 15 provider boundary
        run: |
          python -m compileall -q \
            gateway/searxng_search_provider.py \
            gateway/web_search_discovery.py \
            gateway/research_query_fallback.py \
            gateway/research_source_quality.py \
            tests/test_phase15_searxng_provider_reliability.py \
            tests/test_phase15_query_fallback_and_source_quality.py
      - name: Phase 15 provider reliability tests
        run: |
          python -m pytest -q \
            tests/test_phase15_searxng_provider_reliability.py \
            tests/test_phase15_query_fallback_and_source_quality.py
      - name: Sealed search/retrieval regression matrix
        run: |
          python -m pytest -q \
            tests/test_phase12_searxng_search_provider.py \
            tests/test_phase12_searxng_search_discovery.py \
            tests/test_phase12_web_search_discovery.py \
            tests/test_phase13_provider_specific_research_activation.py \
            tests/test_phase14_source_quality.py \
            tests/test_phase14_retrieval_reliability.py \
            tests/test_phase14_research_operations.py

  guardian-provider-reliability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: platform/guardian
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - name: Compile Guardian boundaries
        run: |
          python -m compileall -q \
            tests/test_phase15_provider_reliability_boundary.py \
            tests/test_phase14_research_operations_boundary.py \
            tests/test_phase13_provider_specific_research_activation_boundary.py \
            tests/test_phase12h_searxng_provider_boundary.py
      - name: Phase 15 Guardian boundary
        run: |
          python -m unittest -v \
            tests.test_phase15_provider_reliability_boundary \
            tests.test_phase14_research_operations_boundary \
            tests.test_phase13_provider_specific_research_activation_boundary \
            tests.test_phase12h_searxng_provider_boundary

  dashboard-research-visibility:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Research workspace boundary
        run: npm run test:research-workspace
      - name: Research operations and navigation boundary
        run: npm run test:research-operations
      - name: Lint dashboard
        run: npm run lint
      - name: Build dashboard
        run: npm run build
      - name: Build production dashboard image
        run: docker build --pull=false -t dap-dashboard-phase15-ci .
